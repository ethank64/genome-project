<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; }

    #controls {
      position: absolute;
      z-index: 2;
      padding: 8px;
      background: white;
    }
  </style>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>

<body>
  <div id="controls">
    <label for="view-select">Community:</label>
    <select id="view-select"></select>
  </div>

  <div id="graph"></div>

  <script>
    function nodeValAccessor(node) {
      let centrality = node.val;
      return centrality
    }

    fetch("community_graphs.json")
      .then(response => response.json())
      .then(function (payload) {
        let communities = payload.communities;
        let views = [];

        for (let i = 0; i < communities.length; i++) {
          let community = communities[i];
          let community_start = String(community.community_start);

          views.push({
            id: "community-" + i,
            label: community_start,
            data: { nodes: community.nodes, links: community.links },
          });
        }

        let select = document.getElementById("view-select");
        let graphHost = document.getElementById("graph");

        for (let i = 0; i < views.length; i++) {
          let option = document.createElement("option");
          option.value = String(i);
          option.textContent = views[i].label;
          select.appendChild(option);
        }

        let graph = ForceGraph3D()(graphHost)
          .backgroundColor("black")
          .nodeVal(nodeValAccessor)
          .nodeRelSize(5)
          .nodeColor(node => node.color)
          .linkOpacity(0.55)
          .linkWidth(0.6)
          

          
        function setView(index) {
          let view = views[Number(index)];

          graph.graphData({
            nodes: view.data.nodes,
            links: view.data.links,
          });
        }

        select.addEventListener("change", () => {
          setView(select.value);
        });

        setView("0");
      })
  </script>
</body>
</html>
