<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; }

    #controls {
      position: absolute;
      z-index: 2;
      padding: 8px;
      background: #fff;
    }
  </style>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>

<body>
  <div id="controls">
    <label for="view-select">Community:</label>
    <select id="view-select"></select>
  </div>

  <div id="graph"></div>

  <script>
    function nodeValAccessor(node) {
      let centrality = node.val;
      return centrality
    }

    fetch("community_graphs.json")
      .then(function (r) {
        return r.json();
      })
      .then(function (payload) {
        let communities = (payload && payload.communities);
        let views = [];

        for (let i = 0; i < communities.length; i++) {
          let c = communities[i];
          let cid = String(c.community_start);

          views.push({
            id: "community-" + i,
            label: cid,
            data: { nodes: c.nodes, links: c.links },
          });
        }

        let select = document.getElementById("view-select");
        let graphHost = document.getElementById("graph");

        for (let j = 0; j < views.length; j++) {
          let option = document.createElement("option");
          option.value = String(j);
          option.textContent = views[j].label;
          select.appendChild(option);
        }

        let graph = ForceGraph3D()(graphHost)
          .backgroundColor("black")
          .nodeVal(nodeValAccessor)
          .nodeRelSize(5)
          .nodeColor(function (node) {
            return node.color;
          })
          .linkOpacity(0.55)
          .linkWidth(0.6)
          
        function setView(index) {
          let view = views[Number(index)];

          graph.graphData({
            nodes: view.data.nodes,
            links: view.data.links,
          });
        }

        select.addEventListener("change", () => {
          setView(select.value);
        });

        setView("0");
      })
  </script>
</body>
</html>
