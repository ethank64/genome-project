<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; }
  </style>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>

<body>
  <div id="graph"></div>
  <script>
    fetch("graph_data.json")
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        ForceGraph3D()(document.getElementById("graph"))
          .backgroundColor("black")
          .graphData(data)
          .nodeLabel(function (node) {
            return String(node.id);
          });
      })
  </script>
</body>
</html>
